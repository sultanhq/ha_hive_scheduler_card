<svg xmlns="http://www.w3.org/2000/svg" width="840" height="260" viewBox="0 0 840 260" role="img" aria-labelledby="title desc">
  <title id="title">Hive Scheduler Card schedule flow</title>
  <desc id="desc">The Home Assistant card edits schedules through Zigbee2MQTT. The Hive receiver stores and executes the timetable, and fresh read-back confirms saves.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f8c"/></marker>
  </defs>
  <rect width="840" height="260" rx="14" fill="#f3f6f7"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#263238">
    <text x="420" y="33" font-size="20" font-weight="bold">Hive Scheduler Card</text>
    <g fill="#fff" stroke="#087f8c" stroke-width="2">
      <rect x="24" y="70" width="226" height="94" rx="10"/>
      <rect x="307" y="70" width="226" height="94" rx="10"/>
      <rect x="590" y="70" width="226" height="94" rx="10"/>
    </g>
    <text x="137" y="103" font-size="17" font-weight="bold">Home Assistant card</text>
    <text x="137" y="130" font-size="14">View · edit · verify</text>
    <text x="420" y="103" font-size="17" font-weight="bold">Zigbee2MQTT</text>
    <text x="420" y="130" font-size="14">Existing Hive converter</text>
    <text x="703" y="103" font-size="17" font-weight="bold">Hive SLR1c receiver</text>
    <text x="703" y="130" font-size="14">Stores and runs the timetable</text>
    <g fill="none" stroke="#087f8c" stroke-width="2" marker-end="url(#arrow)">
      <path d="M 252 110 H 303"/>
      <path d="M 535 110 H 586"/>
      <path d="M 703 168 V 207 H 137 V 168"/>
    </g>
    <text x="420" y="239" font-size="14">Fresh receiver read-back confirms saved transitions</text>
  </g>
</svg>
