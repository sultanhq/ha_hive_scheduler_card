<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hive Scheduler Card — mock receiver preview</title>
<style>
body { margin:24px; background:#f3f5f6; color:#263238; font:16px system-ui; --primary-color:#087f8c; --primary-text-color:#263238; --secondary-text-color:#59676d; --card-background-color:#fff; --divider-color:#dce2e5; }
main { max-width:1050px; margin:auto; } ha-card { display:block; background:white; border-radius:12px; box-shadow:0 1px 5px #0002; } .mobile { width:360px; max-width:100%; margin-top:24px; } pre { white-space:pre-wrap; font-size:13px; } h1 {font-size:24px;} button { padding:10px; }
</style></head><body><main>
<h1>Hive Scheduler Card — mock receiver</h1><p>Local preview only. No Home Assistant connection or hardware writes.</p>
<button id="mobile">Toggle narrow preview</button><button id="viewer">Toggle administrator/viewer</button>
<section id="cards"><hive-scheduler-card id="week"></hive-scheduler-card><div class="mobile"><hive-scheduler-card id="graph"></hive-scheduler-card></div></section>
<pre id="messages" aria-live="polite"></pre>
</main><script type="module">
import './dist/hive-scheduler-card.js';
const days=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
const entities=Object.fromEntries(days.map(day=>[day,`text.renamed_${day}`]));
const cards=[document.querySelector('#week'),document.querySelector('#graph')];
const states={ 'climate.hive_example':{entity_id:'climate.hive_example',state:'auto',attributes:{friendly_name:'Hive Heating'}} };
for(const day of days)states[entities[day]]={entity_id:entities[day],state:'06:07/20.5 19:31/1 19:31/1 19:31/1 19:31/1 19:31/1',attributes:{}};
const listeners=new Map();let staged={};
let hass={ states,user:{is_admin:true}, connection:{subscribeMessage:async(callback,{topic})=>{ if(!listeners.has(topic))listeners.set(topic,new Set()); listeners.get(topic).add(callback); return ()=>listeners.get(topic).delete(callback); }},
callService:async(domain,service,{topic,payload})=>{
 document.querySelector('#messages').textContent=`${topic}\n${payload}`;
 if(topic.endsWith('/set'))staged={...staged,...JSON.parse(payload)};
 if(topic.endsWith('/get'))setTimeout(()=>{
  const response={};for(const key of Object.keys(JSON.parse(payload))){const day=key.slice(9);if(staged[key])states[entities[day]]={...states[entities[day]],state:staged[key],last_updated:new Date().toISOString()};response[key]=states[entities[day]].state;}
  hass={...hass,states:{...states}};for(const card of cards)card.hass=hass;
  for(const callback of listeners.get('zigbee2mqtt/Hive Reciever')||[])callback({topic:'zigbee2mqtt/Hive Reciever',payload:JSON.stringify(response),retain:false});
 },350);
}};
for(const [i,card] of cards.entries()){card.setConfig({type:'custom:hive-scheduler-card',entity:'climate.hive_example',mqtt_device:'Hive Reciever',name:i?'Hive Heating · narrow graph':'Hive Heating · week',view_mode:i?'graph':'week',schedule_entities:entities});card.hass=hass;}
document.querySelector('#mobile').onclick=()=>document.querySelector('#cards').classList.toggle('mobile');
document.querySelector('#viewer').onclick=()=>{hass={...hass,user:{is_admin:!hass.user.is_admin}};for(const card of cards)card.hass=hass;};
</script></body></html>
