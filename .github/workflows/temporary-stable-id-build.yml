name: Temporary build of stable entity form fix
on:
  push:
    branches:
      - fix/stable-entity-id-editor
permissions:
  contents: write
jobs:
  compile-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit generated HACS bundle to the fix branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/hive-scheduler-card.js
          if ! git diff --cached --quiet; then
            git commit -m "Build HACS bundle for stable entity ID fix"
            git push origin HEAD:fix/stable-entity-id-editor
          fi
