name: CI

on:
  push:
    branches:
      - main
      - feat/hive-slr1c-scheduler
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check committed build matches source
        run: git diff --exit-code -- dist/hive-scheduler-card.js

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hive-scheduler-card
          path: dist/hive-scheduler-card.js
